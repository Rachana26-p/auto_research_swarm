services:
  - type: web
    name: auto-research-swarm-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: API_KEY
        value: test-api-key
      - key: FRONTEND_URL
        value: https://*.vercel.app
