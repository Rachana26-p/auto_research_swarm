# ==============================================================================
# Model Pool Configuration (WS3 Free Model Router)
# Configured with verified free-tier limits (no billing / credit card required)
# ==============================================================================

providers:
  - id: groq_reasoning
    provider: groq
    base_url_env: GROQ_BASE_URL
    default_base_url: https://api.groq.com/openai/v1
    key_env: GROQ_API_KEY
    model_env: GROQ_MODEL
    default_model: qwen/qwen3.8-27b
    allowed_roles:
      - reasoning
      - planner
      - validator
      - paper_composer
    max_context: 128000
    json_support: true
    rpm: 30
    rpd: 14400
    tpm: 30000
    priority: 1

  - id: groq_fast
    provider: groq
    base_url_env: GROQ_BASE_URL
    default_base_url: https://api.groq.com/openai/v1
    key_env: GROQ_API_KEY
    model_env: GROQ_FAST_MODEL
    default_model: openai/gpt-oss-20b
    allowed_roles:
      - extraction
      - discovery
      - writing
    max_context: 128000
    json_support: true
    rpm: 30
    rpd: 14400
    tpm: 30000
    priority: 2

  - id: gemini_flash
    provider: gemini
    base_url_env: GEMINI_BASE_URL
    default_base_url: https://generativelanguage.googleapis.com/v1beta
    key_env: GOOGLE_API_KEY
    model_env: GEMINI_MODEL
    default_model: gemma-4-26b-a4b-it
    allowed_roles:
      - reasoning
      - extraction
      - validator
      - writing
      - paper_composer
    max_context: 1000000
    json_support: true
    rpm: 15
    rpd: 1500
    tpm: 1000000
    priority: 1

  - id: gemini_embeddings
    provider: gemini
    base_url_env: GEMINI_BASE_URL
    default_base_url: https://generativelanguage.googleapis.com/v1beta
    key_env: GOOGLE_API_KEY
    model_env: GEMINI_EMBEDDING_MODEL
    default_model: gemini-embedding-001
    allowed_roles:
      - embedding
    max_context: 2048
    json_support: false
    rpm: 15
    rpd: 1500
    tpm: 1000000
    priority: 1

  - id: openrouter_free
    provider: openrouter
    base_url_env: OPENROUTER_BASE_URL
    default_base_url: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
    model_env: OPENROUTER_FREE_MODEL
    default_model: nvidia/nemotron-3.5-lightning:free
    allowed_roles:
      - reasoning
      - extraction
      - writing
      - paper_composer
    max_context: 32768
    json_support: true
    rpm: 20
    rpd: 1000
    tpm: 100000
    priority: 3

  - id: mistral_free
    provider: mistral
    base_url_env: MISTRAL_BASE_URL
    default_base_url: https://api.mistral.ai/v1
    key_env: MISTRAL_API_KEY
    model_env: MISTRAL_MODEL
    default_model: mistral-small-latest
    allowed_roles:
      - reasoning
      - extraction
      - writing
      - paper_composer
    max_context: 32768
    json_support: true
    rpm: 60
    rpd: 5000
    tpm: 50000
    priority: 4
